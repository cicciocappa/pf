<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavMesh Crowd Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .toolbar {
            background: #16213e;
            padding: 10px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }
        .toolbar button {
            background: #0f3460;
            color: #eee;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toolbar button:hover {
            background: #e94560;
        }
        .toolbar label {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar input[type="file"] {
            display: none;
        }
        .info {
            margin-left: auto;
            font-size: 12px;
            color: #888;
        }
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .status {
            background: #16213e;
            padding: 8px 20px;
            font-size: 12px;
            border-top: 1px solid #0f3460;
        }
        .help {
            position: absolute;
            bottom: 50px;
            right: 20px;
            background: rgba(22, 33, 62, 0.9);
            padding: 15px;
            border-radius: 8px;
            font-size: 11px;
            line-height: 1.6;
        }
        .help h4 {
            margin-bottom: 8px;
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <label>
            <button id="loadBtn">Carica NavMesh</button>
            <input type="file" id="fileInput" accept=".json">
        </label>
        <button id="clearAgents">Rimuovi Agenti</button>
        <button id="generateSample">NavMesh di Esempio</button>
        <div class="info">
            Agenti: <span id="agentCount">0</span> |
            Selezionati: <span id="selectedCount">0</span> |
            FPS: <span id="fps">0</span>
        </div>
    </div>
    <div class="canvas-container">
        <canvas id="canvas"></canvas>
        <div class="help">
            <h4>Controlli</h4>
            <div><b>Click sinistro + drag:</b> Selezione rettangolare</div>
            <div><b>Click destro:</b> Aggiungi agente / Muovi selezionati</div>
            <div><b>Alt + Click sinistro:</b> Attiva/Disattiva poligono</div>
            <div><b>Rotella:</b> Zoom</div>
            <div><b>Click centrale + drag:</b> Pan</div>
        </div>
    </div>
    <div class="status" id="status">Carica una navmesh per iniziare</div>

    <script type="importmap">
    {
        "imports": {
            "mathcat": "./navcat/node_modules/mathcat/dist/index.js",
            "navcat": "./navcat/dist/index.js",
            "navcat/blocks": "./navcat/dist/blocks.js",
            "navcat/three": "./navcat/dist/three.js"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
