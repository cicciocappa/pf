<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navcat Test - 3D Editor Export</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            background: #16213e;
            padding: 12px;
            border-bottom: 1px solid #0f3460;
        }

        .toolbar button {
            background: #0f3460;
            color: #eee;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 8px;
        }

        .toolbar button:hover {
            background: #e94560;
        }

        .toolbar input[type="file"] {
            display: none;
        }

        .canvas-container {
            flex: 1;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(22, 33, 62, 0.9);
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            max-width: 300px;
        }

        .info h4 {
            color: #e94560;
            margin-bottom: 8px;
        }

        .info pre {
            font-size: 10px;
            color: #aaa;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <label>
            <button>Load Navcat Export</button>
            <input type="file" id="fileInput" accept=".json">
        </label>
        <button id="generateNavmesh">Generate Navmesh</button>
        <button id="spawnAgents">Spawn Agents</button>
    </div>

    <div class="canvas-container">
        <canvas id="canvas"></canvas>

        <div class="info">
            <h4>Navcat Test</h4>
            <div id="infoContent">
                <p>Load a navmesh3d.json file exported from the 3D editor.</p>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.170.0",
            "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        class NavcatTestViewer {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.loadedData = null;

                // Setup Three.js scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x1a1a2e);

                const aspect = window.innerWidth / window.innerHeight;
                this.camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 1000);
                this.camera.position.set(30, 30, 30);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);

                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;

                // Lighting
                const ambient = new THREE.AmbientLight(0x404040, 2);
                this.scene.add(ambient);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
                dirLight.position.set(20, 30, 10);
                this.scene.add(dirLight);

                // Grid
                const gridHelper = new THREE.GridHelper(100, 100, 0x2a3f5f, 0x2a3f5f);
                this.scene.add(gridHelper);

                // Event listeners
                this.setupEvents();

                // Resize handler
                window.addEventListener('resize', () => this.onResize());

                // Start render loop
                this.animate();
            }

            setupEvents() {
                document.getElementById('fileInput').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            try {
                                this.loadNavcatData(JSON.parse(ev.target.result));
                            } catch (err) {
                                console.error('Error loading file:', err);
                                this.updateInfo(`Error: ${err.message}`);
                            }
                        };
                        reader.readAsText(file);
                    }
                    e.target.value = '';
                });

                document.getElementById('generateNavmesh').addEventListener('click', () => {
                    this.generateNavmesh();
                });

                document.getElementById('spawnAgents').addEventListener('click', () => {
                    this.spawnAgents();
                });
            }

            loadNavcatData(data) {
                this.loadedData = data;

                // Clear scene
                while (this.scene.children.length > 3) {
                    this.scene.remove(this.scene.children[3]);
                }

                // Visualize geometry
                const positions = new Float32Array(data.geometry.positions);
                const indices = new Uint32Array(data.geometry.indices);

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setIndex(new THREE.BufferAttribute(indices, 1));
                geometry.computeVertexNormals();

                const material = new THREE.MeshStandardMaterial({
                    color: 0x3a5a40,
                    side: THREE.DoubleSide,
                    flatShading: false
                });

                const mesh = new THREE.Mesh(geometry, material);
                this.scene.add(mesh);

                // Wireframe overlay
                const wireframeMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ff00,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.2
                });
                const wireframeMesh = new THREE.Mesh(geometry, wireframeMaterial);
                this.scene.add(wireframeMesh);

                this.updateInfo(`
                    <p><strong>Geometry loaded</strong></p>
                    <p>Vertices: ${positions.length / 3}</p>
                    <p>Triangles: ${indices.length / 3}</p>
                    <pre>${JSON.stringify(data.navmeshConfig, null, 2)}</pre>
                `);
            }

            generateNavmesh() {
                if (!this.loadedData) {
                    this.updateInfo('No data loaded. Load a navcat export first.');
                    return;
                }

                this.updateInfo(`
                    <p><strong>Navmesh Generation</strong></p>
                    <p>This would call navcat's createNavMesh() function.</p>
                    <p>Note: Navcat library integration pending.</p>
                `);

                // TODO: Integrate navcat library
                // const navmesh = await createNavMesh({
                //     positions: new Float32Array(this.loadedData.geometry.positions),
                //     indices: new Uint32Array(this.loadedData.geometry.indices),
                //     ...this.loadedData.navmeshConfig
                // });
            }

            spawnAgents() {
                this.updateInfo(`
                    <p><strong>Agent Spawning</strong></p>
                    <p>This would spawn agents on the navmesh.</p>
                    <p>Note: Agent system integration pending.</p>
                `);
            }

            updateInfo(html) {
                const el = document.getElementById('infoContent');
                if (el) el.innerHTML = html;
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        // Initialize viewer
        window.viewer = new NavcatTestViewer();
    </script>
</body>
</html>
