<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NavCat + Custom OBJ</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #debug-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      background: rgba(0,0,0,0.8);
      padding: 15px;
      border-radius: 5px;
      max-width: 350px;
      max-height: 90vh;
      overflow-y: auto;
    }
    #debug-panel h3 { margin: 0 0 10px 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 5px; }
    #debug-panel .section { margin-bottom: 15px; }
    #debug-panel .section-title { color: #ff0; font-weight: bold; margin-bottom: 5px; }
    #debug-panel .value { color: #0ff; }
    #debug-panel .error { color: #f55; }
    #debug-panel .success { color: #5f5; }
    #debug-panel .warn { color: #fa0; }
    #debug-panel label { display: block; margin: 3px 0; cursor: pointer; }
    #debug-panel input[type="checkbox"] { margin-right: 5px; }
  </style>
</head>
<body>
  <div id="debug-panel">
    <h3>NavCat Debug Panel</h3>
    <div id="status" class="section">
      <div class="section-title">Status</div>
      <div id="status-text">Loading level.obj...</div>
    </div>
    <div id="geometry-info" class="section" style="display:none;">
      <div class="section-title">Input Geometry</div>
      <div id="geometry-details"></div>
    </div>
    <div id="navmesh-options" class="section" style="display:none;">
      <div class="section-title">NavMesh Options</div>
      <div id="options-details"></div>
    </div>
    <div id="navmesh-info" class="section" style="display:none;">
      <div class="section-title">NavMesh Result</div>
      <div id="navmesh-details"></div>
    </div>
    <div id="path-info" class="section" style="display:none;">
      <div class="section-title">Pathfinding</div>
      <div id="path-instructions" style="margin-bottom:8px;color:#aaa;">
        <b style="color:#0f0;">Left click</b> = Set START (agents go here)<br>
        <b style="color:#f55;">Right click</b> = Set END (agents go here)
      </div>
      <div id="path-details"></div>
    </div>
    <div id="crowd-info" class="section" style="display:none;">
      <div class="section-title">Crowd Simulation</div>
      <div id="crowd-details"></div>
    </div>
    <div id="visibility-controls" class="section" style="display:none;">
      <div class="section-title">Visibility</div>
      <label><input type="checkbox" id="toggle-mesh" checked> Show Original Mesh</label>
      <label><input type="checkbox" id="toggle-navmesh" checked> Show NavMesh</label>
      <label><input type="checkbox" id="toggle-agents" checked> Show Agents</label>
      <label><input type="checkbox" id="toggle-wireframe"> Wireframe Mode</label>
    </div>
  </div>

  <!-- Import Map -->
<script type="importmap">
    {
      "imports": {
        "navcat": "https://unpkg.com/navcat@0.1.0/dist/index.js",
        "navcat/blocks": "https://unpkg.com/navcat@0.1.0/dist/blocks.js",
        "navcat/three": "https://unpkg.com/navcat@0.1.0/dist/three.js",
        "mathcat": "https://unpkg.com/mathcat@0.0.6/dist/index.js",
        "three": "https://unpkg.com/three@0.181.0/build/three.module.js",
        "three/addons/lines/LineMaterial.js": "https://unpkg.com/three@0.181.0/examples/jsm/lines/LineMaterial.js",
        "three/addons/lines/Line2.js": "https://unpkg.com/three@0.181.0/examples/jsm/lines/Line2.js",
        "three/addons/lines/LineGeometry.js": "https://unpkg.com/three@0.181.0/examples/jsm/lines/LineGeometry.js",
        "three/examples/jsm/controls/OrbitControls": "https://unpkg.com/three@0.181.0/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/loaders/OBJLoader": "https://unpkg.com/three@0.181.0/examples/jsm/loaders/OBJLoader.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls';
    import { OBJLoader } from 'three/examples/jsm/loaders/OBJLoader';
    import { generateSoloNavMesh, crowd } from 'navcat/blocks';
    import { findPath, findNearestPoly, createFindNearestPolyResult, DEFAULT_QUERY_FILTER } from 'navcat';
    import { createNavMeshHelper } from 'navcat/three';

    // === Setup Three.js scene ===
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lights
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // === Debug helpers ===
    function setStatus(text, type = 'normal') {
      const el = document.getElementById('status-text');
      el.textContent = text;
      el.className = type;
      console.log(`[NavCat] ${text}`);
    }

    function showSection(id) {
      document.getElementById(id).style.display = 'block';
    }

    function formatNumber(n) {
      return n.toLocaleString();
    }

    // === Pathfinding state ===
    let currentNavMesh = null;
    let startPoint = null;
    let endPoint = null;
    let startMarker = null;
    let endMarker = null;
    let pathLine = null;
    let pathMarkers = [];
    const halfExtents = [0.5, 1.0, 0.5];

    // === Crowd simulation state ===
    const NUM_AGENTS = 8;
    let crowdSystem = null;
    const agentIds = [];
    const agentMeshes = [];
    let agentsGroup = null;
    let prevTime = performance.now();

    // Colori per gli agenti
    const agentColors = [
      0xff6b6b, 0x4ecdc4, 0x45b7d1, 0xf7dc6f,
      0xbb8fce, 0x58d68d, 0xf0b27a, 0x85c1e9
    ];

    // === Raycaster for mouse interaction ===
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let walkableMeshes = [];

    // === Load OBJ and process ===
    let originalMesh = null;
    let navMeshHelperObject = null;

    const loader = new OBJLoader();
    setStatus('Loading level.obj...', 'warn');

    loader.load(
      'level.obj',
      (object) => {
        setStatus('Processing geometry...', 'warn');
        originalMesh = object;

        // Unisci tutte le geometrie in un'unica lista di posizioni e indici
        const positions = [];
        const indices = [];
        let meshCount = 0;

        object.traverse((child) => {
          if (child.isMesh) {
            meshCount++;
            const geom = child.geometry;
            const posAttr = geom.getAttribute('position');
            const indexArray = geom.index ? geom.index.array : null;

            const baseIndex = positions.length / 3;

            // Aggiungi posizioni
            for (let i = 0; i < posAttr.count; i++) {
              positions.push(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
            }

            // Aggiungi indici
            if (indexArray) {
              for (let i = 0; i < indexArray.length; i++) {
                indices.push(indexArray[i] + baseIndex);
              }
            } else {
              for (let i = 0; i < posAttr.count; i += 3) {
                indices.push(baseIndex + i, baseIndex + i + 1, baseIndex + i + 2);
              }
            }
          }
        });

        const float32Positions = new Float32Array(positions);
        const uint32Indices = new Uint32Array(indices);
        const triangleCount = uint32Indices.length / 3;
        const vertexCount = float32Positions.length / 3;

        // Debug: geometry info
        showSection('geometry-info');
        const bbox = new THREE.Box3().setFromObject(object);
        const center = bbox.getCenter(new THREE.Vector3());
        const size = bbox.getSize(new THREE.Vector3());

        document.getElementById('geometry-details').innerHTML = `
          Meshes: <span class="value">${meshCount}</span><br>
          Vertices: <span class="value">${formatNumber(vertexCount)}</span><br>
          Triangles: <span class="value">${formatNumber(triangleCount)}</span><br>
          Bounds: <span class="value">${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)}</span><br>
          Center: <span class="value">(${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})</span>
        `;
        console.log('[NavCat] Geometry loaded:', { meshCount, vertexCount, triangleCount, bounds: size, center });

        // Aggiungi l'oggetto alla scena
        scene.add(object);

        // Raccogli le mesh per il raycasting
        object.traverse((child) => {
          if (child.isMesh) {
            walkableMeshes.push(child);
          }
        });

        // Centra la telecamera
        camera.position.copy(center).add(new THREE.Vector3(0, size.y, size.z * 1.5));
        controls.target.copy(center);
        controls.update();

        // === Configura navcat ===
        const cellSize = 0.15;
        const cellHeight = 0.15;

        const walkableRadiusWorld = 0.3;
        const walkableHeightWorld = 2.0;
        const walkableClimbWorld = 0.5;
        const walkableSlopeAngleDegrees = 45;

        const options = {
          cellSize,
          cellHeight,
          walkableRadiusWorld,
          walkableRadiusVoxels: Math.ceil(walkableRadiusWorld / cellSize),
          walkableClimbWorld,
          walkableClimbVoxels: Math.ceil(walkableClimbWorld / cellHeight),
          walkableHeightWorld,
          walkableHeightVoxels: Math.ceil(walkableHeightWorld / cellHeight),
          walkableSlopeAngleDegrees,
          borderSize: 0,
          minRegionArea: 8,
          mergeRegionArea: 20,
          maxSimplificationError: 1.3,
          maxEdgeLength: 12,
          maxVerticesPerPoly: 5,
          detailSampleDistance: cellSize * 6,
          detailSampleMaxError: cellHeight * 1,
        };

        // Debug: show options
        showSection('navmesh-options');
        document.getElementById('options-details').innerHTML = `
          Cell Size: <span class="value">${options.cellSize}</span><br>
          Cell Height: <span class="value">${options.cellHeight}</span><br>
          Walkable Radius: <span class="value">${options.walkableRadiusWorld} (${options.walkableRadiusVoxels} voxels)</span><br>
          Walkable Height: <span class="value">${options.walkableHeightWorld} (${options.walkableHeightVoxels} voxels)</span><br>
          Walkable Climb: <span class="value">${options.walkableClimbWorld} (${options.walkableClimbVoxels} voxels)</span><br>
          Max Slope: <span class="value">${options.walkableSlopeAngleDegrees}°</span><br>
          Min Region Area: <span class="value">${options.minRegionArea}</span><br>
          Max Edge Length: <span class="value">${options.maxEdgeLength}</span>
        `;
        console.log('[NavCat] Options:', options);

        // === Genera navmesh ===
        try {
          setStatus('Generating navmesh...', 'warn');
          const startTime = performance.now();

          const input = { positions: float32Positions, indices: uint32Indices };
          console.log('[NavCat] Input:', { positionsLength: input.positions.length, indicesLength: input.indices.length });

          const result = generateSoloNavMesh(input, options);
          const genTime = (performance.now() - startTime).toFixed(2);

          console.log('[NavCat] Generation result:', result);

          const navMesh = result.navMesh;
          const intermediates = result.intermediates;

          // Debug: show navmesh info
          showSection('navmesh-info');

          let navMeshInfo = `Generation Time: <span class="value">${genTime}ms</span><br>`;

          if (navMesh) {
            // Log struttura navMesh per debug
            console.log('[NavCat] NavMesh structure:', navMesh);
            console.log('[NavCat] NavMesh keys:', Object.keys(navMesh));

            // Conta poligoni e vertici nella navmesh
            let polyCount = 0;
            let navVertCount = 0;
            let tileCount = 0;

            // Gestisci diverse possibili strutture
            if (navMesh.tiles) {
              const tiles = Array.isArray(navMesh.tiles) ? navMesh.tiles : Object.values(navMesh.tiles);
              tileCount = tiles.length;
              tiles.forEach(tile => {
                if (tile.polys) polyCount += Array.isArray(tile.polys) ? tile.polys.length : 0;
                if (tile.verts) navVertCount += (Array.isArray(tile.verts) ? tile.verts.length : 0) / 3;
              });
            } else if (navMesh.polys) {
              // Struttura senza tiles
              polyCount = Array.isArray(navMesh.polys) ? navMesh.polys.length : 0;
              navVertCount = navMesh.verts ? navMesh.verts.length / 3 : 0;
            }

            navMeshInfo += `
              Status: <span class="success">Generated successfully</span><br>
              Tiles: <span class="value">${tileCount}</span><br>
              Polygons: <span class="value">${formatNumber(polyCount)}</span><br>
              NavMesh Vertices: <span class="value">${formatNumber(navVertCount)}</span><br>
              Structure: <span class="value">${Object.keys(navMesh).join(', ')}</span>
            `;
            console.log('[NavCat] NavMesh stats:', { tileCount, polyCount, navVertCount });
          } else {
            navMeshInfo += `Status: <span class="error">No navmesh generated</span>`;
          }

          if (intermediates) {
            console.log('[NavCat] Intermediates available:', Object.keys(intermediates));
            navMeshInfo += `<br>Intermediates: <span class="value">${Object.keys(intermediates).join(', ')}</span>`;
          }

          document.getElementById('navmesh-details').innerHTML = navMeshInfo;

          // Visualizza navmesh
          if (navMesh) {
            currentNavMesh = navMesh; // Salva riferimento globale
            const navMeshHelper = createNavMeshHelper(navMesh);
            navMeshHelperObject = navMeshHelper.object;
            navMeshHelperObject.position.y += 0.05;
            scene.add(navMeshHelperObject);
            console.log('[NavCat] NavMesh helper added to scene');

            // === Setup crowd simulation ===
            setupCrowd(navMesh, center);
          }

          // === Setup pathfinding interattivo ===
          showSection('path-info');
          updatePathInfo();
          setupMouseInteraction();
          setStatus('Ready! Click to set start/end points.', 'success');

          // Show visibility controls
          showSection('visibility-controls');
          setupVisibilityControls();

        } catch (err) {
          console.error('[NavCat] Generation failed:', err);
          showSection('navmesh-info');
          document.getElementById('navmesh-details').innerHTML = `
            Status: <span class="error">FAILED</span><br>
            Error: <span class="error">${err.message}</span><br>
            Stack: <pre style="color:#f55;font-size:10px;white-space:pre-wrap;">${err.stack}</pre>
          `;
          setStatus('Error: ' + err.message, 'error');
        }
      },
      (xhr) => {
        if (xhr.lengthComputable) {
          const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
          setStatus(`Loading level.obj... ${percent}%`, 'warn');
        }
      },
      (error) => {
        console.error('[NavCat] Error loading level.obj:', error);
        setStatus('Failed to load level.obj!', 'error');
      }
    );

    // === Visibility controls ===
    function setupVisibilityControls() {
      document.getElementById('toggle-mesh').addEventListener('change', (e) => {
        if (originalMesh) originalMesh.visible = e.target.checked;
      });

      document.getElementById('toggle-navmesh').addEventListener('change', (e) => {
        if (navMeshHelperObject) navMeshHelperObject.visible = e.target.checked;
      });

      document.getElementById('toggle-agents').addEventListener('change', (e) => {
        if (agentsGroup) agentsGroup.visible = e.target.checked;
      });

      document.getElementById('toggle-wireframe').addEventListener('change', (e) => {
        if (originalMesh) {
          originalMesh.traverse((child) => {
            if (child.isMesh && child.material) {
              child.material.wireframe = e.target.checked;
            }
          });
        }
      });
    }

    // === Mouse interaction ===
    function setupMouseInteraction() {
      // Disabilita menu contestuale per usare click destro
      renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

      renderer.domElement.addEventListener('pointerdown', (event) => {
        const point = getPointOnMesh(event);
        if (!point) {
          console.log('[NavCat] Click missed mesh');
          return;
        }

        if (event.button === 0) {
          // Left click = START - muovi agenti qui
          console.log('[NavCat] Setting START:', point);
          startPoint = point;
          updateMarker('start', point);
          moveAgentsToPoint(point); // Muovi agenti al punto di start
        } else if (event.button === 2) {
          // Right click = END - muovi agenti qui
          console.log('[NavCat] Setting END:', point);
          endPoint = point;
          updateMarker('end', point);
          moveAgentsToPoint(point); // Muovi agenti al punto di end
        }

        updatePath();
        updatePathInfo();
      });
    }

    function getPointOnMesh(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(walkableMeshes, true);

      if (intersects.length > 0) {
        const p = intersects[0].point;
        return [p.x, p.y, p.z];
      }
      return null;
    }

    function updateMarker(type, position) {
      const color = type === 'start' ? 0x00ff00 : 0xff3333;
      const size = 0.3;

      // Rimuovi vecchio marker
      if (type === 'start' && startMarker) {
        scene.remove(startMarker);
      } else if (type === 'end' && endMarker) {
        scene.remove(endMarker);
      }

      // Crea nuovo marker (sfera + linea verticale)
      const group = new THREE.Group();

      // Sfera
      const sphereGeom = new THREE.SphereGeometry(size, 16, 16);
      const sphereMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 });
      const sphere = new THREE.Mesh(sphereGeom, sphereMat);
      sphere.position.set(position[0], position[1] + size, position[2]);
      group.add(sphere);

      // Linea verticale
      const lineGeom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(position[0], position[1], position[2]),
        new THREE.Vector3(position[0], position[1] + size * 3, position[2])
      ]);
      const lineMat = new THREE.LineBasicMaterial({ color });
      const line = new THREE.Line(lineGeom, lineMat);
      group.add(line);

      scene.add(group);

      if (type === 'start') {
        startMarker = group;
      } else {
        endMarker = group;
      }
    }

    function updatePath() {
      // Rimuovi vecchio path
      clearPath();

      if (!currentNavMesh || !startPoint || !endPoint) {
        updateCrowdInfo();
        return;
      }

      console.log('[NavCat] Finding path from', startPoint, 'to', endPoint);
      const pathResult = findPath(currentNavMesh, startPoint, endPoint, halfExtents, DEFAULT_QUERY_FILTER);
      console.log('[NavCat] Path result:', pathResult);

      if (pathResult.path && pathResult.path.length > 0) {
        const pathPoints = pathResult.path.map(p => p.position);
        drawPath(pathPoints);
      }

      updateCrowdInfo();
    }

    function clearPath() {
      if (pathLine) {
        scene.remove(pathLine);
        pathLine = null;
      }
      pathMarkers.forEach(m => scene.remove(m));
      pathMarkers = [];
    }

    function updatePathInfo() {
      let pathInfo = '';

      if (startPoint) {
        pathInfo += `Start: <span class="success">(${startPoint.map(v => v.toFixed(2)).join(', ')})</span><br>`;
      } else {
        pathInfo += `Start: <span class="warn">Not set (left click)</span><br>`;
      }

      if (endPoint) {
        pathInfo += `End: <span class="error">(${endPoint.map(v => v.toFixed(2)).join(', ')})</span><br>`;
      } else {
        pathInfo += `End: <span class="warn">Not set (right click)</span><br>`;
      }

      if (startPoint && endPoint && currentNavMesh) {
        const pathResult = findPath(currentNavMesh, startPoint, endPoint, halfExtents, DEFAULT_QUERY_FILTER);
        if (pathResult.path && pathResult.path.length > 0) {
          pathInfo += `Path: <span class="success">${pathResult.path.length} waypoints</span>`;
        } else {
          pathInfo += `Path: <span class="error">No path found!</span>`;
        }
      }

      document.getElementById('path-details').innerHTML = pathInfo;
    }

    // === Funzione per disegnare il percorso ===
    function drawPath(points, color = 0x00ffff) {
      if (points.length < 2) return;

      // Linea del percorso
      const lineGeometry = new THREE.BufferGeometry();
      const positions = [];
      for (const [x, y, z] of points) {
        positions.push(x, y + 0.15, z);
      }
      lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

      const material = new THREE.LineBasicMaterial({ color, linewidth: 3 });
      pathLine = new THREE.Line(lineGeometry, material);
      scene.add(pathLine);

      // Sfere sui waypoints
      const waypointGeom = new THREE.SphereGeometry(0.15, 8, 8);
      const waypointMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });

      for (let i = 1; i < points.length - 1; i++) {
        const [x, y, z] = points[i];
        const sphere = new THREE.Mesh(waypointGeom, waypointMat);
        sphere.position.set(x, y + 0.15, z);
        scene.add(sphere);
        pathMarkers.push(sphere);
      }
    }

    // === Crowd simulation setup ===
    function setupCrowd(navMesh, center) {
      console.log('[NavCat] Setting up crowd simulation...');

      // Crea il sistema crowd
      crowdSystem = crowd.create(NUM_AGENTS);
      console.log('[NavCat] Crowd system created:', crowdSystem);

      // Parametri agente
      const agentParams = {
        radius: 0.3,
        height: 1.8,
        maxAcceleration: 8.0,
        maxSpeed: 2.5,
        collisionQueryRange: 1.5,
        pathOptimizationRange: 15.0,
        separationWeight: 1.5,
        updateFlags:
          crowd.CrowdUpdateFlags.ANTICIPATE_TURNS |
          crowd.CrowdUpdateFlags.SEPARATION |
          crowd.CrowdUpdateFlags.OBSTACLE_AVOIDANCE |
          crowd.CrowdUpdateFlags.OPTIMIZE_VIS |
          crowd.CrowdUpdateFlags.OPTIMIZE_TOPO,
        queryFilter: DEFAULT_QUERY_FILTER,
      };

      // Crea gruppo per le mesh degli agenti
      agentsGroup = new THREE.Group();
      scene.add(agentsGroup);

      const searchExtents = [5, 5, 5];

      // Crea gli agenti in cerchio attorno al centro
      for (let i = 0; i < NUM_AGENTS; i++) {
        const angle = (i / NUM_AGENTS) * Math.PI * 2;
        const spawnRadius = 2;
        const spawnPos = [
          center.x + Math.cos(angle) * spawnRadius,
          center.y,
          center.z + Math.sin(angle) * spawnRadius
        ];

        // Crea un nuovo findResult per ogni agente
        const findResult = createFindNearestPolyResult();
        findNearestPoly(findResult, navMesh, spawnPos, searchExtents, DEFAULT_QUERY_FILTER);

        if (findResult.nodeRef) {
          const pos = [findResult.position[0], findResult.position[1], findResult.position[2]];
          const agentId = crowd.addAgent(crowdSystem, navMesh, pos, agentParams);

          if (agentId !== undefined && agentId !== null) {
            agentIds.push(agentId);
            console.log(`[NavCat] Agent ${i} (id=${agentId}) created at`, pos);

            // Crea mesh visuale per l'agente
            const agentGeom = new THREE.SphereGeometry(0.3, 16, 16);
            const agentMat = new THREE.MeshStandardMaterial({
              color: agentColors[i % agentColors.length],
              roughness: 0.3,
              metalness: 0.2
            });
            const agentMesh = new THREE.Mesh(agentGeom, agentMat);
            agentMesh.position.set(pos[0], pos[1] + 0.3, pos[2]);
            agentMesh.castShadow = true;
            agentsGroup.add(agentMesh);
            agentMeshes.push(agentMesh);
          } else {
            console.warn(`[NavCat] Agent ${i} creation returned invalid id`);
          }
        } else {
          console.warn(`[NavCat] Could not spawn agent ${i} - no valid navmesh position found for`, spawnPos);
        }
      }

      // Mostra info crowd
      showSection('crowd-info');
      updateCrowdInfo();

      console.log(`[NavCat] Created ${agentIds.length} agents, meshes: ${agentMeshes.length}`);
    }

    function updateCrowdInfo() {
      let activeCount = 0;
      let movingCount = 0;

      if (crowdSystem && crowdSystem.agents) {
        for (const agentId in crowdSystem.agents) {
          activeCount++;
          const agent = crowdSystem.agents[agentId];
          if (agent && agent.targetRef) {
            movingCount++;
          }
        }
      }

      document.getElementById('crowd-details').innerHTML = `
        Agents: <span class="value">${activeCount}</span><br>
        Moving: <span class="value">${movingCount}</span><br>
        Target: <span class="${endPoint ? 'success' : 'warn'}">${endPoint ? 'Set' : 'Not set'}</span>
      `;
    }

    function moveAgentsToPoint(targetPoint) {
      if (!crowdSystem || !currentNavMesh || !targetPoint) {
        return;
      }

      console.log('[NavCat] Moving agents to', targetPoint);

      // Trova il poligono target sulla navmesh
      const findResult = createFindNearestPolyResult();
      findNearestPoly(findResult, currentNavMesh, targetPoint, halfExtents, DEFAULT_QUERY_FILTER);

      if (!findResult.nodeRef) {
        console.warn('[NavCat] Could not find target on navmesh');
        return;
      }

      console.log('[NavCat] Target found at', findResult.position, 'nodeRef:', findResult.nodeRef);

      // Salva il target corrente per il controllo dell'arrivo
      currentTarget = [findResult.position[0], findResult.position[1], findResult.position[2]];
      arrivedAgents.clear(); // Reset degli agenti arrivati

      // Imposta il target per tutti gli agenti
      let count = 0;
      for (const agentId in crowdSystem.agents) {
        crowd.requestMoveTarget(crowdSystem, agentId, findResult.nodeRef, findResult.position);
        count++;
      }

      console.log(`[NavCat] ${count} agents moving to target`);
      updateCrowdInfo();
    }

    function updateAgentVisuals() {
      if (!crowdSystem) return;

      // Debug: log crowd structure once
      if (!crowdSystem._debugLogged) {
        console.log('[NavCat] Crowd system:', crowdSystem);
        console.log('[NavCat] Crowd agents:', crowdSystem.agents);
        console.log('[NavCat] Stored agent IDs:', agentIds);
        console.log('[NavCat] Agent meshes count:', agentMeshes.length);
        crowdSystem._debugLogged = true;
      }

      // Itera usando lo stesso pattern degli esempi navcat
      let meshIndex = 0;
      for (const agentId in crowdSystem.agents) {
        const agent = crowdSystem.agents[agentId];
        const mesh = agentMeshes[meshIndex];

        if (agent && mesh && agent.position) {
          // Aggiorna posizione
          mesh.position.set(agent.position[0], agent.position[1] + 0.3, agent.position[2]);

          // Ruota verso la direzione del movimento
          if (agent.velocity) {
            const speed = Math.sqrt(agent.velocity[0] ** 2 + agent.velocity[2] ** 2);
            if (speed > 0.1) {
              const angle = Math.atan2(agent.velocity[0], agent.velocity[2]);
              mesh.rotation.y = angle;
            }
          }
        }
        meshIndex++;
      }
    }

    // Traccia il target corrente per controllare l'arrivo
    let currentTarget = null;
    const ARRIVAL_THRESHOLD = 0.8;
    const arrivedAgents = new Set();

    function checkAgentArrival() {
      if (!crowdSystem || !currentTarget) return;

      for (const agentId in crowdSystem.agents) {
        const agent = crowdSystem.agents[agentId];
        if (agent && agent.position) {
          const dx = agent.position[0] - currentTarget[0];
          const dz = agent.position[2] - currentTarget[2];
          const dist = Math.sqrt(dx * dx + dz * dz);

          // Se l'agente è vicino al target, segnalo come arrivato
          if (dist < ARRIVAL_THRESHOLD && !arrivedAgents.has(agentId)) {
            arrivedAgents.add(agentId);
            // Prova a fermare l'agente se la funzione esiste
            if (typeof crowd.resetMoveTarget === 'function') {
              try {
                crowd.resetMoveTarget(crowdSystem, agentId);
              } catch (e) {
                console.log('[NavCat] resetMoveTarget not available');
              }
            }
          }
        }
      }
    }

    // === Animate ===
    function animate() {
      requestAnimationFrame(animate);

      const currentTime = performance.now();
      const deltaTime = (currentTime - prevTime) / 1000;
      prevTime = currentTime;

      // Aggiorna crowd simulation
      if (crowdSystem && currentNavMesh) {
        const clampedDelta = Math.min(deltaTime, 0.1);
        crowd.update(crowdSystem, currentNavMesh, clampedDelta);
        checkAgentArrival();
        updateAgentVisuals();
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
