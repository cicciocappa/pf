        console.log("Poligoni generati:", navMeshPolygons);

        // --- 3. VISUALIZZAZIONE (Rendering su Canvas) ---
        const canvas = document.getElementById('debugCanvas');
        const ctx = canvas.getContext('2d');

        // Funzione helper per disegnare poligoni
        function drawPolygon(points, color, strokeColor) {
            if (points.length < 3) return;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            if (strokeColor) {
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        // A. Disegniamo la NavMesh (le aree verdi dove si può camminare)
        // navMeshPolygons è un array di poligoni, dove ogni poligono è un array di punti {x,y}
        navMeshPolygons.forEach(polygon => {
            // Verde semi-trasparente con bordo verde scuro
            drawPolygon(polygon, 'rgba(0, 255, 0, 0.4)', 'rgba(0, 100, 0, 0.8)');
        });

        // B. Disegniamo gli ostacoli (Rossi)
        obstacles.forEach(obstacle => {
            drawPolygon(obstacle, 'rgba(255, 0, 0, 0.6)', 'black');
        });
