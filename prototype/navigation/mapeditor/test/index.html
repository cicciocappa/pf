<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavGraph Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.95);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.6;
            max-width: 280px;
        }

        .info-panel strong {
            color: #e94560;
        }

        .info-panel .section {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #0f3460;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .checkbox-group input {
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .checkbox-group label {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="canvas-container">
        <canvas id="canvas"></canvas>
        <div class="info-panel">
            <div><strong>NavGraph Test</strong></div>
            <div class="section">
                <strong>Controls:</strong><br>
                Shift + Click: Spawn agent<br>
                Right Click: Move to formation<br>
                Alt + Wheel: Zoom<br>
                Space + Drag: Pan
            </div>
            <div class="section">
                <strong>Options:</strong>
                <div class="checkbox-group">
                    <input type="checkbox" id="use-rvo" checked>
                    <label for="use-rvo">Enable RVO (collision avoidance)</label>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
